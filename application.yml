      # (Optional) OAuth1 access token URI
      # ! Value cannot be blank
#      token-uri: ${app.bitbucket.oauth.url}/access-token
      
      # (Optional) OAuth1 request token URI
      # ! Value cannot be blank
#      request-token-uri: ${app.bitbucket.oauth.url}/request-token
      
      # (Optional) Consumer Key from OAuth Application Link
      # ! Value cannot be blank
