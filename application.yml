      # (Optional) OAuth2 access token URI
      # ! Value cannot be blank
#      token-uri: ${app.gitlab.url}/oauth/token
      
      # (Optional) OAuth2 user info URI
      # ! Value cannot be blank
#      user-info-uri: ${app.gitlab.url}/api/v4/user
      
      # (Optional) GitLab OAuth2 App Client ID
      # ! Value cannot be blank
#      client-id: <gitlab_app_client_id>
      
      # (Optional) GitLab OAuth2 App Client secret
      # ! Value cannot be blank
#      client-secret: <gitlab_app_client_secret>
      
      # (Optional) Override redirect check to match against URL specified in 'app.git-bridge-url'
#      override-redirect: false
      
      # (Optional) Enable automatic refresh of access tokens
#      refresh-tokens: true
    
    # (Optional) Proxy configuration
#    proxy:
      
      # (Optional) Proxy host
#      host:
      
      # (Optional) Proxy port
#      port:
      
      # (Optional) Proxy user name
#      user:
      
      # (Optional) Proxy password
#      pass:
  
  # Gitea
  gitea:
    
    # Gitea Enterprise Server URL (e.g: http://gitea.example.net)
    url: ${gitServerUrl}
    
    # (Optional) Gitea REST API URL
#    api-url: ${app.gitea.url}/api/v1
    
    # (Optional) Gitea URL to create a new Git repository
#    new-repository-uri: ${app.gitea.url}/repo/create
    
    # (Optional) Maximum size of a file allowed to be pushed to a Git repository (value should match respective Gitea configuration)
#    file-size-limit: 100000000
    
    # (Optional) Allowed clock skew between the Bridge for Git server and Gitea Server (in seconds)
#    allow-clock-skew-sec: 0
    
    # (Optional) Enable login with Personal Access Token instead of OAuth2
#    personal-access-token-login: ${app.security.personal-access-token-login}
    
    # (Optional) OAuth2 configuration
    oauth2:
      
      # (Optional) OAuth2 authorization URI
      # ! Value cannot be blank
#      authorization-uri: ${app.gitea.url}/login/oauth/authorize
      
      # (Optional) OAuth2 access token URI
      # ! Value cannot be blank
#      token-uri: ${app.gitea.url}/login/oauth/access_token
      
      # (Optional) OAuth2 user info URI
      # ! Value cannot be blank
#      user-info-uri: ${app.gitea.url}/api/v1/user
      
      # (Optional) Gitea OAuth2 App Client ID
      # ! Value cannot be blank
      client-id: ${gitClientID}
      
      # (Optional) Gitea OAuth2 App Client secret
      # ! Value cannot be blank
      client-secret: ${gitClientSecret}

      # (Optional) Override redirect check to match against URL specified in 'app.git-bridge-url'
#      override-redirect: false
      
      # (Optional) Enable automatic refresh of access tokens
      refresh-tokens: true
    
    # (Optional) Proxy configuration
#    proxy:
      
      # (Optional) Proxy host
#      host:
      
      # (Optional) Proxy port
#      port:
      
      # (Optional) Proxy user name
