server:
  # Port number of the application
  port: 8080

  # Define secure connection for the Bridge for Git server
#  ssl:
#    key-store-type:
#    key-store:
#    key-store-password:
#    key-alias:
  
app:
  
  # Location to store Bridge for Git operational data
  # ! Value cannot be blank
  workdir: /workdir
  
  # Bridge for Git global configuration
  git-bridge:
    
    # Bridge for Git URL
    url: ${b4gUrl}
    
    # (Optional) Bridge for Git Webhook URL
#    webhook-url: ${app.git-bridge.url}
    
    # (Optional) Bridge for Git instance identifier
    # ! Maximum text size: 8
#    identifier:
    
    # (Optional) Dependencies limit
    # ! Minimum value: 0
#    dependencies-limit: 50
    
    # (Optional) Specify the commit author for changes coming from Endevor
    # ! Applicable values: MAPPING_OWNER, ENDEVOR_USER, ENDEVOR_USER_GIT
#    commit-author: MAPPING_OWNER
    
    # (Optional) Specify the committer name to be used for changes coming from Endevor
    # ! Applicable values: DISPLAY_NAME, USERNAME
#    commit-committer-name: DISPLAY_NAME
    
    # (Optional) REST API client properties
#    rest-client:
      
      # (Optional) Operation keep alive loop interval for connecting (in milliseconds)
      # ! Minimum value: 1
#      connect-timeout-msec: 5000
      
      # (Optional) Operation keep alive loop interval for read operations (in milliseconds)
      # ! Minimum value: 1
#      read-timeout-msec: 160000
    
    # (Optional) Shutdown timeout
#    shutdown-timeout: 2m
    
    # (Optional) Operation retention minutes
    # ! Minimum value: 0
#    operation-retention-minutes: 1440
    
    # (Optional) Startup validation
    # ! Applicable values: DISABLED, ENABLED, WAIT
#    startup-validation: ENABLED
    
    # (Optional) Startup validation for alternate providers
    # ! Applicable values: DISABLED, ENABLED, WAIT
#    alternate-providers-startup-validation: ${app.git-bridge.startup-validation}
    
    # (Optional) Refresh revert threshold minutes
#    refresh-revert-threshold-minutes: 5
    
    # (Optional) Pre-push validation for all branches
#    pre-push-validate-all-branches: false
    
    # (Optional) Custom login background image
#    login-background-image:
    
    # (Optional) For the specified number of processed tasks, keep alive operations are sent
    # ! Minimum value: 1
#    operation-keep-alive-loop-interval: 100
  
  # Endevor configuration
  endevor:
    
    # (Optional) REST API connection timeout (in milliseconds)
    # ! Minimum value: 1
#    connect-timeout-msec: 5000
    
    # (Optional) REST API read timeout (in milliseconds)
    # ! Minimum value: 1
#    read-timeout-msec: 160000
    
    # (Optional) Trim trailing spaces in elements retrieved from Endevor
    # ! Applicable values: NO_TRIM, TYPES_ONLY, ALWAYS
#    trim-trailing-spaces: NO_TRIM
    
    # (Optional) List of element types where characters out of Endevor compare region are removed
#    trimmed-types:
#      - ASMMAC
#      - ASMPGM
#      - COBCOPY
#      - COBPGM
    
    # (Optional) Allow files without extensions
#    ignore-empty-file-extensions: false
    
    # (Optional) Number of retries for failing Endevor REST API requests
    # ! Minimum value: 1
#    retries: 5
    
    # (Optional) Period in milliseconds for checking the status of an Endevor Connection
    # ! Minimum value: 10000
#    status-check-msec: 120000
    
    # (Optional) Name of the directory in the Git repository for storing listings from Endevor
    # ! Value cannot be blank
#    listing-directory: listing
    
    # (Optional) File extension for storing listings from Endevor
    # ! Value cannot be blank
#    listing-extension: txt
    
    # (Optional) Retrieve element
#    retrieve:
      
      # (Optional) Override Endevor sign-out for an element
#      override-signout: true
      
      # (Optional) Retrieve element without signing it out
#      no-signout: true
      
      # (Optional) Perform element signin after the retrieve
      # ! Applicable values: NEVER, KEEP_PREVIOUS, ALWAYS
#      signin-after: NEVER
      
      # (Optional) Retrieve element defaults
#      default:
        
        # (Optional) Default retrieve CCID
        # ! Value cannot be NULL
        # ! Minimum text size: 1
        # ! Maximum text size: 12
#        ccid: RETRIEVE
        
        # (Optional) Default retrieve Comment
        # ! Value cannot be NULL
        # ! Minimum text size: 1
        # ! Maximum text size: 40
#        comment: Bridge for Git RETRIEVE
        
        # (Optional) Default retrieve To-Location
        # ! Value cannot be NULL
        # ! Minimum text size: 1
        # ! Maximum text size: 768
#        to-location: Bridge for Git ${app.git-bridge.identifier}
    
    # (Optional) Add/Update element
#    update:
      
      # (Optional) Override Endevor signout for an element
#      override-signout: true
      
      # (Optional) Perform element signin after the action
      # ! Applicable values: NEVER, KEEP_PREVIOUS, ALWAYS
#      signin-after: ALWAYS
    
    # (Optional) Generate element
#    generate:
      
      # (Optional) Override Endevor signout for an element
#      override-signout: true
      
      # (Optional) Perform element signin after the action
      # ! Applicable values: NEVER, KEEP_PREVIOUS, ALWAYS
#      signin-after: ALWAYS
    
    # (Optional) Automatically refresh Endevor Web Services and/or Zowe API ML tokens
#    refresh-tokens: true
    
    # (Optional) Allow clock skew for JWT based Endevor Web Services and/or Zowe API ML tokens (in seconds)
#    allow-clock-skew-sec: 0
    
    # (Optional) Endevor Connection cache
#    cache:
      
      # (Optional) Duration in minutes for validity of the Endevor cache
      # ! Minimum value: 1
#      expiration-minutes: 1440
      
      # (Optional) Number of retries for updating the Endevor cache
#      max-retries: 5
  
  # Git client configuration
  git:
    
    # (Optional) Timeout for the Git push operation (in seconds)
#    push-timeout-sec: 0
    
    # (Optional) Timeout for the Git pull/fetch operations (in seconds)
#    receive-timeout-sec: 0
    
    # (Optional) Rate of sending keep-alive when processing asynchronous Git operation (keep-alive will run every ${app.rules.garbage-collector.inactive-operation-msec} / ${app.git.async-keep-alive-rate})
#    async-keep-alive-rate: 10
    
    # (Optional) Minimum size of the thread pool used for asynchronous processing of Git operations
    # ! Minimum value: 1
#    pool-size: 1
    
    # (Optional) Maximum size of the thread pool used for asynchronous processing of Git operations
    # ! Minimum value: 2
#    maximum-pool-size: 10
    
    # (Optional) Use native Git client installed on the machine for resource intensive operations
#    use-native-client: false
    
    # (Optional) Character encoding used by the native Git client
#    native-client-encoding:
    
    # (Optional) Additional Git configuration
#    git-config:
#      core:
#        symlinks: false
  
  # Security
  security:
    
    # Primary authentication provider - Git Server
    # ! Applicable values: AZURE, BITBUCKET, GITEA, GITHUB, GITLAB
    auth-provider: GITEA
    
    # (Optional) Alternative authentication provider - Git Servers
    # ! Applicable values: AZURE, BITBUCKET, GITEA, GITHUB, GITLAB
#    alternate-auth-providers:
#      - AZURE
#      - BITBUCKET
#      - GITEA
#      - GITHUB
#      - GITLAB
    
    # Administrator usernames. They are case sensitive and must match the git server usernames.
    administrators:
      - tbattiva
      - mauro.saito
    
    # (Optional) Enable login with Personal Access Token instead of OAuth2
#    personal-access-token-login: ${personal-access-token-login-map.${app.security.auth-provider}:false}
    
    # (Optional) Default role to be assigned to new users
    # ! Applicable values: DEVELOPER, MAPPING_ADMIN
#    default-role: MAPPING_ADMIN
    
    # Authentication configuration
    auth:
      
      # (Optional) Duration of Web UI user token - logout inactive user after (in minutes)
      # ! Minimum value: 5
#      token-expiration-minutes: 20
      
      # (Optional) Duration of Web UI user session - force new user login after (in minutes)
      # ! Minimum value: 15
#      session-expiration-minutes: ${app.security.auth.token-expiration-minutes}
      
      # (Optional) Webhook secret token from the webhooks repository settings of the Git Server
#      webhook-secret:
      
      # (Optional) Generated api key that is used in MFWebhook Server to authenticate the payloads sent via the hooks
#      mfwebhook-apikey:
      
      # (Optional) Client side pre-push authentication method
      # ! Applicable values: NONE, GIT_PERSONAL_ACCESS_TOKEN, LOCAL_HOOK_TOKEN
#      pre-push-hook: NONE
    
    # (Optional) Encryption mode for sensitive data stored in database
    # ! Applicable values: AES128_GLOBAL_KEY, AES128_FILE_KEY, AES128_PERSONAL_KEY, AES128_STORE_KEY, AES256_GLOBAL_KEY, AES256_FILE_KEY, AES256_PERSONAL_KEY, AES256_STORE_KEY
#    encryption: AES128_FILE_KEY
    
    # (Optional) File in the local filesystem containing the encryption key
    # ! Value cannot be blank
#    encryption-file-key: ${app.workdir}/EVCS_root/encryption.key
    
    # (Optional) Encryption keystore details
#    encryption-keystore:
      
      # (Optional) Keystore path
#      path:
      
      # (Optional) Keystore password
#      password:
      
      # (Optional) Keystore type
#      type:
      
      # (Optional) Key alias
#      alias:
      
      # (Optional) Key password
#      key-password:
    
    # (Optional) Disable HTTP OPTIONS method for the Bridge for Git server application
#    disable-http-options-method: true
    
    # (Optional) List of valid alternate host names for this server
#    alternate-origins:
#      - https://proxy1.example.com
#      - https://proxy2.example.com
  
  # GitHub
#   github:
    
    # GitHub Enterprise Server URL (e.g: http://github.example.net)
#     url: <github_enterprise_server_url>
    
    # (Optional) GitHub REST API URL
#    api-url: ${app.github.url}/api/v3
    
    # (Optional) GitHub URL to create a new Git repository
#    new-repository-uri: ${app.github.url}/new
    
    # GitHub Enterprise GitHub App public link (e.g: http://github.example.net/github-apps/bridge-for-git)
#     app-public-link: <github_app_public_link>
    
    # (Optional) Maximum size of a file allowed to be pushed to a Git repository (value should match respective GitHub configuration)
#    file-size-limit: 100000000
    
    # (Optional) Enable login with Personal Access Token instead of OAuth2
#    personal-access-token-login: ${app.security.personal-access-token-login}
    
    # (Optional) The GitHub App properties can be found on GitHub: User Account > Settings > Developer settings > GitHub Apps
#    oauth2:
      
      # (Optional) OAuth2 authorization URI
      # ! Value cannot be blank
#      authorization-uri: ${app.github.url}/login/oauth/authorize
      
      # (Optional) OAuth2 access token URI
      # ! Value cannot be blank
#      token-uri: ${app.github.url}/login/oauth/access_token
      
      # (Optional) OAuth2 user info URI
      # ! Value cannot be blank
#      user-info-uri: ${app.github.api-url}/user
      
      # (Optional) GitHub OAuth2 App Client ID
      # ! Value cannot be blank
#      client-id: <github_app_client_id>
      
      # (Optional) GitHub OAuth2 App Client secret
      # ! Value cannot be blank
#      client-secret: <github_app_client_secret>
      
      # (Optional) Override redirect check to match against URL specified in 'app.git-bridge-url'
#      override-redirect: false
      
      # (Optional) Enable automatic refresh of access tokens
#      refresh-tokens: true
    
    # (Optional) Proxy configuration
#    proxy:
      
      # (Optional) Proxy host
#      host:
      
      # (Optional) Proxy port
#      port:
      
      # (Optional) Proxy user name
#      user:
      
      # (Optional) Proxy password
#      pass:
  
