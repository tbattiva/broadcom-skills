    # (Optional) Provide full element details in notification messages
#    full-element-details: false
  
  # Dispatcher rules
  rules:
    
    # (Optional) New mapping or branch initialization
#    initialization:
      
      # (Optional) Maximum number of concurrent runs of the same processing rule for different branches or mappings
      # ! Minimum value: 1
#      pool-size: 1
      
      # (Optional) Running mode for individual Endevor requests within the respective processing rule
      # ! Applicable values: SERIAL, PARALLEL
#      runner-mode: SERIAL
    
    # (Optional) Synchronization from Endevor to Git (scheduled and event-based sync-back or add element)
#    refresh:
      
      # (Optional) Maximum number of concurrent runs of the same processing rule for different branches or mappings
