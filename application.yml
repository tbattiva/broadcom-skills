      # (Optional) OAuth2 user info URI
      # ! Value cannot be blank
#      user-info-uri: ${app.bitbucket.url}/rest/api/latest/users
      
      # (Optional) Bitbucket Application Link Client ID
      # ! Value cannot be blank
#      client-id: <bitbucket_client_id>
      
      # (Optional) Bitbucket Application Link Client secret
      # ! Value cannot be blank
#      client-secret: <bitbucket_client_secret>
      
      # (Optional) Override redirect check to match against URL specified in 'app.git-bridge-url'
#      override-redirect: false
      
      # (Optional) Enable automatic refresh of access tokens
#      refresh-tokens: true
    
    # (Optional) Proxy configuration
#    proxy:
      
      # (Optional) Proxy host
#      host:
      
      # (Optional) Proxy port
#      port:
      
      # (Optional) Proxy user name
#      user:
      
      # (Optional) Proxy password
#      pass:
  
  # Azure DevOps
#   azure:
    
    # Azure DevOps Server URL (e.g: http://azure.example.net)
#     url: <azure_devops_server_url>
    
    # (Optional) Azure DevOps REST API URL
#    api-url: ${app.azure.url}
    
    # (Optional) Azure DevOps User API URL
#    user-api-url: ${app.azure.url}
    
    # Azure DevOps Server Default Collection
#     default-collection: <default_collection>
    
    # (Optional) Azure DevOps Services Directory (tenant) ID
#    tenant-id: common
    
    # (Optional) Maximum size of a file allowed to be pushed to a Git repository (value should match respective Azure DevOps configuration)
#    file-size-limit: 100000000
    
    # (Optional) Allowed clock skew between the Bridge for Git server and Azure DevOps Server (in seconds)
#    allow-clock-skew-sec: 0
    
    # (Optional) Enable login with Personal Access Token instead of OAuth2
#    personal-access-token-login: true
    
    # (Optional) OAuth2 configuration
#    oauth2:
      
      # (Optional) OAuth2 authorization URI
      # ! Value cannot be blank
#      authorization-uri: https://login.microsoftonline.com/${app.azure.tenant-id}/oauth2/v2.0/authorize
      
      # (Optional) OAuth2 access token URI
      # ! Value cannot be blank
#      token-uri: https://login.microsoftonline.com/${app.azure.tenant-id}/oauth2/v2.0/token
      
      # (Optional) OAuth2 user info URI
      # ! Value cannot be blank
