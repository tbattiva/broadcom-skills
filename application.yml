#      pool-size: 1
      
      # (Optional) Running mode for individual Endevor requests within the respective processing rule
      # ! Applicable values: SERIAL, PARALLEL
#      runner-mode: SERIAL
    
    # (Optional) Synchronization from Git to Endevor
#    synchronization:
      
      # (Optional) Maximum number of concurrent runs of the same processing rule for different branches or mappings
      # ! Minimum value: 1
#      pool-size: 1
      
      # (Optional) Running mode for individual Endevor requests within the respective processing rule
      # ! Applicable values: SERIAL, PARALLEL
#      runner-mode: SERIAL
    
    # (Optional) Delete mapping or branch
#    delete-mapping:
      
      # (Optional) Maximum number of concurrent runs of the same processing rule for different branches or mappings
      # ! Minimum value: 1
#      pool-size: 1
      
      # (Optional) Running mode for individual Endevor requests within the respective processing rule
      # ! Applicable values: SERIAL, PARALLEL
#      runner-mode: SERIAL
    
    # (Optional) Generate changes after successful synchronization
#    generate:
      
      # (Optional) Maximum number of concurrent runs of the same processing rule for different branches or mappings
      # ! Minimum value: 1
#      pool-size: 1
      
      # (Optional) Running mode for individual Endevor requests within the respective processing rule
      # ! Applicable values: SERIAL, PARALLEL
#      runner-mode: SERIAL
    
    # (Optional) Migrate mapping to a different repository
#    migrate-mapping:
      
      # (Optional) Maximum number of concurrent runs of the same processing rule for different branches or mappings
      # ! Minimum value: 1
#      pool-size: 1
      
      # (Optional) Running mode for individual Endevor requests within the respective processing rule
      # ! Applicable values: SERIAL, PARALLEL
#      runner-mode: SERIAL
    
    # (Optional) Remove old operations from the App activity
#    garbage-collector:
      
      # (Optional) Number of milliseconds after which a completed operation is garbage collected
      # ! Minimum value: 10000
#      inactive-operation-msec: 1800000
    
    # (Optional) Remove old temporary files
#    temporary-file-collector:
      
      # (Optional) Enable automatic cleanup of old temporary files
#      enabled: true
      
      # (Optional) Number of hours after which temporary file is removed
