  # Logging configuration
  logging:
    
    # (Optional) Logging level of the application
    # ! Applicable values: ERROR, WARN, INFO, DEBUG, TRACE
#    git-bridge-level: INFO
    
    # (Optional) Logging level of the local pre-push hook
#    local-validation-debug-mode: false
    
    # (Optional) Enable logging of configuration properties on startup
#    additional-log-info: true
    
    # (Optional) Maximum number of archive files to keep
#    max-history: 90
    
    # (Optional) Maximum log file size before it gets archived
#    max-file-size: 300MB
    
    # (Optional) Total size of all archive files
#    total-size-cap: 1GB
  
  # Dispatcher
  dispatcher:
    
    # (Optional) Enable dispatcher at application startup
#    enable-on-startup: true
    
    # (Optional) Minimum size of the dispatcher thread-pool
    # ! Minimum value: 4
#    pool-size: 4
    
    # (Optional) Maximum size of the dispatcher thread-pool
    # ! Minimum value: 4
#    maximum-pool-size: 100
    
    # (Optional) Maximum waiting time between rules evaluation (in milliseconds)
    # ! Minimum value: 10
#    await-timeout-msec: 10000
    
    # (Optional) Minimum waiting time between rules evaluation (in milliseconds)
