    # (Optional) Bitbucket REST API URL
#    api-url: ${app.bitbucket.url}/rest/api/latest
    
    # (Optional) Maximum size of a file allowed to be pushed to a Git repository (value should match respective Bitbucket configuration)
#    file-size-limit: 100000000
    
    # (Optional) Expiration in days of Personal Access Token generated on behalf of users when using OAuth1
    # ! Value cannot be NULL
    # ! Minimum value: 1
#    token-expiration-days: 365
    
    # (Optional) Enable login with Personal Access Token instead of OAuth
#    personal-access-token-login: ${app.security.personal-access-token-login}
    
    # (Optional) Enable login with OAuth2 instead of OAuth1
#    use-oauth2: false
    
    # (Optional) OAuth1 configuration
#    oauth:
      
      # (Optional) Bitbucket OAuth1 URI
      # ! Value cannot be blank
#      url: ${app.bitbucket.url}/plugins/servlet/oauth
      
      # (Optional) OAuth1 authorization URI
      # ! Value cannot be blank
