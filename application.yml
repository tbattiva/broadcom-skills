      # (Optional) Azure DevOps Services OAuth2 App Client ID
      # ! Value cannot be blank
#      client-id: <azure_app_client_id>
      
      # (Optional) Azure DevOps Services OAuth2 App Client secret
      # ! Value cannot be blank
