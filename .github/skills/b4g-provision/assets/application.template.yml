server:
  # Port number of the application
  port: ${port}

  # Define secure connection for the Bridge for Git server
#  ssl:
#    key-store-type:
#    key-store:
#    key-store-password:
#    key-alias:
  
app:
  
  # Location to store Bridge for Git operational data
  # ! Value cannot be blank
  workdir: /workdir
  
  # Bridge for Git global configuration
  git-bridge:
    
    # Bridge for Git URL
    url: ${b4gUrl}

  # Security
  security:
    # Primary authentication provider - Git Server
    auth-provider: GITEA

    administrators:
      - <admin>

  # Gitea
  gitea:
    # Gitea Enterprise Server URL (e.g: http://gitea.example.net)
    url: ${gitServerUrl}

    # OAuth2 configuration
    oauth2:
      client-id: ${gitClientID}
      client-secret: ${gitClientSecret}
      refresh-tokens: true
